[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node -e \"const{createServer}=require('http'),{readFile}=require('fs'),{join}=require('path'),p=process.env.PORT||3000,b='build';const M={'.html':'text/html','.js':'text/javascript','.css':'text/css','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.gif':'image/gif','.ico':'image/x-icon','.json':'application/json','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf','.eot':'application/vnd.ms-fontobject','.map':'application/json','.webp':'image/webp','.webmanifest':'application/manifest+json','.txt':'text/plain','.xml':'application/xml','.pdf':'application/pdf'};createServer((q,s)=>{let u=q.url.split('?')[0];let f=join(b,u==='/'?'/index.html':u);readFile(f,(e,d)=>{if(e){readFile(join(b,'index.html'),(e2,d2)=>{s.writeHead(200,{'Content-Type':'text/html','Cache-Control':'no-cache'});s.end(d2)})}else{let ext='.'+f.split('.').pop().toLowerCase();let ct=M[ext]||'application/octet-stream';let h={'Content-Type':ct,'X-Content-Type-Options':'nosniff'};if(ct.startsWith('image/')||ct.includes('font')||ct.includes('xml')){h['Cache-Control']='public, max-age=86400, immutable'}s.writeHead(200,h);s.end(d)}})}).listen(p,()=>console.log('Serving on '+p))\""