name: Backend Tests

# Gap 2 (Jeff directive 2026-09-19): unit tests gate every push to main.
# Live-server suites (test_api_smoke, test_data_isolation, TOTP, subscription
# state machines, background jobs) are excluded — they are nightly-suite
# material; tests/select_unit_tests.sh holds the canonical exclusion list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Backend unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Start MongoDB
        run: |
          # mongomock-backed suites don't need a real mongod, but data-isolation-
          # adjacent unit tests may bind 27017; use official mongod via apt for CI.
          sudo apt-get update -qq && sudo apt-get install -y -qq mongodb-org 2>/dev/null || true
          if ! command -v mongod >/dev/null 2>&1; then
            # mongodb-org unavailable on ubuntu-latest runners; fall back to
            # mongodb community tarball (v7.0) — no service manager needed.
            curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz -o /tmp/mongo.tgz
            tar -xzf /tmp/mongo.tgz -C /tmp
            sudo ln -sf /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod /usr/local/bin/mongod
          fi
          mkdir -p /tmp/mongodb-data
          mongod --dbpath /tmp/mongodb-data --port 27017 --fork --logpath /tmp/mongod.log
          until mongosh --port 27017 --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 || mongo --port 27017 --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done

      - name: Select unit tests
        working-directory: backend
        id: select
        run: |
          # Emit the --ignore list the same way local runs do; fail if empty.
          ARGS=$(bash tests/select_unit_tests.sh)
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "ignore args: $ARGS" | head -c 400

      - name: Run unit suite
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_database
          JWT_SECRET: ci-only-not-a-real-secret
          CORS_ORIGINS: https://app.trustoffice.app
        run: python -m pytest tests/ ${{ steps.select.outputs.args }} -q -p no:cacheprovider